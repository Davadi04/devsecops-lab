name: DevSecOps Pipeline

on:
  push:
    branches:
      - '**'

# Least-privilege default token perms for the whole workflow.
# Individual jobs do not need write access to the repo.
permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: shopeasy-backend

jobs:

  # ---------------------------------------------------------------------
  # 1. Static analysis - SonarQube (runs on every push, every branch)
  #    Backend and frontend each have their own project key + token.
  # ---------------------------------------------------------------------
  sonarqube-backend:
    name: SonarQube Scan (Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube needs full history for blame/new-code analysis

      - name: SonarQube Scan - Backend
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          args: >
            -Dsonar.projectKey=shopeasy-backend
            -Dsonar.projectName=ShopEasy Backend
            -Dsonar.sources=backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACKEND }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  sonarqube-frontend:
    name: SonarQube Scan (Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan - Frontend
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          args: >
            -Dsonar.projectKey=shopeasy-frontend
            -Dsonar.projectName=ShopEasy Frontend
            -Dsonar.sources=frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ---------------------------------------------------------------------
  # 2. Trivy filesystem scan - fails the build on HIGH/CRITICAL
  # ---------------------------------------------------------------------
  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: [sonarqube-backend, sonarqube-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: '.'
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

  # ---------------------------------------------------------------------
  # 3 & 4. Build image, scan it, push only if the scan passes
  #         (only on main - feature branches stop after the scans above)
  # ---------------------------------------------------------------------
  build-scan-push:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    needs: trivy-fs-scan
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local only - not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Log in to Docker Hub
        # Only runs if the image scan above passed
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  # ---------------------------------------------------------------------
  # 5. Deploy to EC2, pulling the DB secret from Secrets Manager
  #    using a least-privilege IAM user scoped to one secret ARN.
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Fetch DB secret from Secrets Manager
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id shopeasy/db-password \
            --query SecretString \
            --output text)
          echo "::add-mask::$SECRET"
          echo "DB_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_SECRET: ${{ env.DB_SECRET }}
          IMAGE_TAG: ${{ needs.build-scan-push.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_SECRET,IMAGE_TAG,DOCKERHUB_USERNAME
          script: |
            set -euo pipefail
            export DB_PASSWORD="$DB_SECRET"

            docker pull "$DOCKERHUB_USERNAME/shopeasy-backend:$IMAGE_TAG"

            docker stop shopeasy-backend 2>/dev/null || true
            docker rm shopeasy-backend 2>/dev/null || true

            docker run -d \
              --name shopeasy-backend \
              --restart unless-stopped \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -p 8080:8080 \
              "$DOCKERHUB_USERNAME/shopeasy-backend:$IMAGE_TAG"

            unset DB_PASSWORD